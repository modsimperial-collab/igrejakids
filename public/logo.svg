<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="500" height="550">
  <defs>
    <!-- Gradiente da Chama (Vermelho Base -> Laranja -> Amarelo Topo) -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#D32F2F;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#F57C00;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#FBC02D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFEE58;stop-opacity:1" />
    </linearGradient>
  </defs>

  <g transform="translate(0, 10)">
    <!-- 1. CHAMA DO ESPÍRITO SANTO (Topo) -->
    <path d="M 250,20 
             C 275,55 330,105 330,165 
             C 330,220 295,245 250,245 
             C 205,245 170,220 170,165 
             C 170,105 225,55 250,20 Z" 
          fill="url(#flameGrad)" />

    <!-- Curvas Internas Brancas da Chama -->
    <path d="M 250,32 C 235,75 200,120 205,170 C 208,200 225,225 250,235" 
          fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.95" />
    <path d="M 245,65 C 265,105 290,140 285,180" 
          fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.95" />

    <!-- 2. BASE VERMELHA DA CHAMA -->
    <rect x="155" y="240" width="190" height="16" rx="8" fill="#E53935" />

    <!-- 3. ELEMENTOS DE FUNDO DA LOGO (Estrela, Bíblia e Corações) -->
    <!-- Estrela Amarela (Esquerda) -->
    <polygon points="175,275 182,295 202,295 186,307 192,327 175,315 158,327 164,307 148,295 168,295" 
             fill="#FFCA28" opacity="0.9" transform="rotate(-10 175 300)" />

    <!-- Bíblia Sagrada Azul (Centro) -->
    <g transform="translate(205, 250) rotate(8)">
      <rect x="0" y="0" width="62" height="76" rx="7" fill="#29B6F6" />
      <rect x="4" y="4" width="54" height="68" rx="5" fill="#4FC3F7" />
      <!-- Cruz Branca -->
      <rect x="26" y="18" width="10" height="34" rx="2" fill="#FFFFFF" />
      <rect x="16" y="26" width="30" height="10" rx="2" fill="#FFFFFF" />
    </g>

    <!-- Corações Verdes (Direita) -->
    <g transform="translate(308, 268) rotate(15)">
      <!-- Coração Maior -->
      <path d="M 20,10 C 20,4 12,0 6,6 C 0,0 -8,4 -8,10 C -8,20 6,28 6,28 C 6,28 20,20 20,10 Z" 
            fill="#7CB342" />
      <!-- Coração Menor -->
      <path d="M 34,-2 C 34,-6 29,-9 25,-5 C 21,-9 16,-6 16,-2 C 16,5 25,10 25,10 C 25,10 34,5 34,-2 Z" 
            fill="#9CCC65" />
    </g>

    <!-- 4. MONOGRAMA "AD" COM LETRA D PERFEITAMENTE NÍTIDA E SEM CONFUSÃO COM "O" -->
    <!-- Contorno Branco de Fundo -->
    <g stroke="#FFFFFF" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Letra A Loop Esquerdo -->
      <path d="M 120,380 C 80,380 75,320 125,295 C 175,270 230,305 260,375" stroke-width="22" />
      <!-- A Barra Transversal e Elo -->
      <path d="M 100,350 C 180,335 240,335 275,330" stroke-width="20" />
      
      <!-- LETRA D: Haste Vertical Reta + Barriga Arredondada (Totalmente Legível) -->
      <path d="M 275,280 L 265,390" stroke-width="22" />
      <path d="M 265,390 C 315,395 385,370 380,330 C 375,290 320,280 275,280" stroke-width="22" />
    </g>

    <!-- Traço Caligráfico Azul Royal Principal -->
    <g stroke="#005B96" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- LETRA A -->
      <path d="M 120,380 C 80,380 75,320 125,295 C 175,270 230,305 260,375" stroke-width="14" />
      <path d="M 100,350 C 180,335 240,335 275,330" stroke-width="12" />

      <!-- LETRA D (Haste Vertical + Curva Superior Distinta) -->
      <path d="M 275,280 L 265,390" stroke-width="14" />
      <path d="M 265,390 C 315,395 385,370 380,330 C 375,290 320,280 275,280" stroke-width="13" />
    </g>

    <!-- 5. TEXTO: KIDS (Colorido) + MADUREIRA (Azul Escuro Navy) -->
    <g transform="translate(0, 435)">
      <!-- KIDS -->
      <text x="75" y="0" font-family="'Outfit', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#0277BD">K</text>
      <text x="115" y="0" font-family="'Outfit', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#E53935">I</text>
      <text x="135" y="0" font-family="'Outfit', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#7CB342">D</text>
      <text x="175" y="0" font-family="'Outfit', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#FBC02D">S</text>

      <!-- MADUREIRA -->
      <text x="215" y="-2" font-family="'Outfit', 'Arial Black', sans-serif" font-weight="900" font-size="38" fill="#0D47A1" letter-spacing="1">MADUREIRA</text>
    </g>

    <!-- 6. FAIXA DE PINCELADA VERMELHA (Underline) -->
    <path d="M 70,455 Q 250,470 430,455 Q 250,480 70,455 Z" fill="#E53935" />

    <!-- 7. SUBTÍTULO: PAINEIRAS 1 -->
    <text x="250" y="495" text-anchor="middle" font-family="'Outfit', 'Inter', sans-serif" font-weight="800" font-size="28" fill="#0288D1" letter-spacing="2">
      PAINEIRAS 1
    </text>
  </g>
</svg>
